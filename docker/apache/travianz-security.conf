ServerName localhost

<Directory /var/www/html>
    AllowOverride All
    Options -Indexes

    <FilesMatch "^(\.env|composer\.(json|lock)|Dockerfile|compose\.ya?ml)$">
        Require all denied
    </FilesMatch>
</Directory>

RedirectMatch 404 ^/\.git(?:/|$)
RedirectMatch 404 ^/docker(?:/|$)

# Disable the installer as soon as the persistent marker exists.
<LocationMatch "^/install(?:/|$)">
    Require expr "! -f '/var/www/html/var/installed'"
</LocationMatch>
