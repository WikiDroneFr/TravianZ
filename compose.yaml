name: travianz-docker-poc

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: wikidronefr/travianz:poc
    ports:
      - "${TRAVIANZ_HTTP_PORT:-8810}:80"
    volumes:
      - "${TRAVIANZ_DATA_DIR:-../data}/runtime:/var/lib/travianz-runtime"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - travianz

  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:?required}"
      MARIADB_DATABASE: "${MARIADB_DATABASE:-travian}"
      MARIADB_USER: "${MARIADB_USER:-travianz}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:?required}"
    command:
      - --sql-mode=
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - "${TRAVIANZ_DATA_DIR:-../data}/mariadb:/var/lib/mysql"
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin ping -h 127.0.0.1 -uroot -p"$${MARIADB_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - travianz

  cron:
    image: wikidronefr/travianz:poc
    command:
      - /bin/sh
      - -c
      - |
        while [ ! -f /var/www/html/GameEngine/config.php ]; do
          echo "cron: waiting for TravianZ installation..."
          sleep 15
        done

        while true; do
          su -s /bin/sh www-data -c 'php /var/www/html/cron.php'
          status=$$?

          if [ "$$status" -ne 0 ]; then
            echo "cron: execution failed with status $$status"
            sleep 30
          fi
        done
    volumes:
      - "${TRAVIANZ_DATA_DIR:-../data}/runtime:/var/lib/travianz-runtime"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - travianz

  phpmyadmin:
    image: phpmyadmin:5.2.2-apache
    profiles:
      - tools
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "${PHPMYADMIN_HTTP_PORT:-8811}:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - travianz

networks:
  travianz:
    driver: bridge
